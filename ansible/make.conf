KERNCONF=		BSDKIT
BATCH=			yes
# Keep the license framework on: it defines ${_LICENSE_DIR}, which ports such
# as sysutils/nerdctl hand-install into, and it makes portlint's check-license
# meaningful.  Accept every license: bsd.licenses.mk tests each one with
# ${LICENSES_ACCEPTED:M${lic}}, so the lazy ${LICENSE} expands to the port's
# own license there and always matches.  Mirrors pkgkit's env/make.conf.
LICENSES_ACCEPTED=	${LICENSE}
SU_CMD?=		/usr/local/bin/sudo -E sh -c
SENDMAIL_MC=		freebsd.mc
SENDMAIL_SUBMIT_MC=	freebsd.submit.mc
DEV_WARNING_WAIT=	1
USE_PACKAGE_DEPENDS=	yes
