---
- name: pwd_mkdb
  command:
    cmd: pwd_mkdb -p /etc/master.passwd
  changed_when: true

- name: restart_syslogd
  service:
    name: syslogd
    state: restarted

- name: restart_cron
  # rc starts it later in the first boot; see firstboot_rc_services.
  when: "'cron' not in (firstboot_rc_services | default([]))"
  service:
    name: cron
    state: restarted

- name: restart_sshd
  # rc starts it later in the first boot; see firstboot_rc_services.
  when: "'sshd' not in (firstboot_rc_services | default([]))"
  service:
    name: sshd
    state: restarted

- name: restart_ntpd
  # rc starts it later in the first boot; see firstboot_rc_services.
  when: "'ntpd' not in (firstboot_rc_services | default([]))"
  service:
    name: ntpd
    state: restarted

- name: restart_netif
  service:
    name: netif
    state: restarted

- name: restart_routing
  service:
    name: routing
    state: restarted

- name: restart_sysctl
  service:
    name: sysctl
    state: restarted

- name: restart_hostname
  service:
    name: hostname
    state: restarted

- name: restart_postgresql
  # rc starts it later in the first boot; see firstboot_rc_services.
  when: "'postgresql' not in (firstboot_rc_services | default([]))"
  service:
    name: postgresql
    state: restarted

- name: restart_caddy
  # rc starts it later in the first boot; see firstboot_rc_services.
  when: "'caddy' not in (firstboot_rc_services | default([]))"
  service:
    name: caddy
    state: restarted

- name: reload_caddy
  # rc starts it later in the first boot; see firstboot_rc_services.
  when: "'caddy' not in (firstboot_rc_services | default([]))"
  service:
    name: caddy
    state: reloaded

- name: restart_fail2ban
  # rc starts it later in the first boot; see firstboot_rc_services.
  when: "'fail2ban' not in (firstboot_rc_services | default([]))"
  service:
    name: fail2ban
    state: restarted

- name: restart_monit
  # Not running during the first boot; it reads its configuration when it
  # starts. See the monit role.
  when: not (firstboot_in_progress | default(false))
  service:
    name: monit
    state: restarted

- name: reload_monit
  # Not running during the first boot; it reads its configuration when it
  # starts. See the monit role.
  when: not (firstboot_in_progress | default(false))
  command:
    cmd: monit reload
  changed_when: true

- name: reformat_rc_conf
  shell:
    cmd: |
      set -o errexit -o nounset -o pipefail
      _rc_conf=$(mktemp /tmp/XXXXXX)
      sysrc -a -e > ${_rc_conf}
      cat ${_rc_conf} > /etc/rc.conf
      rm -f ${_rc_conf}
  changed_when: true

- name: reformat_loader_conf_local
  shell:
    cmd: |
      set -o errexit -o nounset -o pipefail
      _loader_conf_local=$(mktemp /tmp/XXXXXX)
      sed -e '/^$/d' -e '/^[[:space:]]*#/d' /boot/loader.conf.local | sort > ${_loader_conf_local}
      cat ${_loader_conf_local} > /boot/loader.conf.local
      rm -f ${_loader_conf_local}
  changed_when: true

- name: reformat_sysctl_conf_local
  shell:
    cmd: |
      set -o errexit -o nounset -o pipefail
      _sysctl_conf_local=$(mktemp /tmp/XXXXXX)
      sed -e '/^$/d' -e '/^[[:space:]]*#/d' /etc/sysctl.conf.local | sort > ${_sysctl_conf_local}
      cat ${_sysctl_conf_local} > /etc/sysctl.conf.local
      rm -f ${_sysctl_conf_local}
  changed_when: true
