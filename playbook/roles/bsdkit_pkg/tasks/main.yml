---
- name: Create /usr/local/etc/pkg/repos
  file:
    path: /usr/local/etc/pkg/repos
    state: directory
    owner: root
    group: wheel
    mode: "0755"

- name: Configure default FreeBSD repositories
  copy:
    content: |
      FreeBSD: {
          enabled: no
      }
      FreeBSD-ports: {
          enabled: no
      }
      FreeBSD-ports-kmods: {
          enabled: yes
      }
      FreeBSD-base: {
          enabled: yes
      }
    dest: /usr/local/etc/pkg/repos/FreeBSD.conf
    mode: "0644"
  register: freebsd_repo_conf

- name: Enable bsdkit repository
  copy:
    content: |
      bsdkit: {
          url: "{{ bsdkit_root_url }}/packages-${ABI}-{{ bsdkit_tree }}-{{ bsdkit_pkgset }}"
      }
    dest: /usr/local/etc/pkg/repos/bsdkit.conf
    mode: "0644"
  register: bsdkit_repo_conf

- name: Refresh package catalogues after a repository change
  when: freebsd_repo_conf is changed or bsdkit_repo_conf is changed
  command:
    cmd: pkg update -f
  changed_when: true
