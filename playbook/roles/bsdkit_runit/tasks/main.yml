---
- name: Install packages
  community.general.pkgng:
    name:
      - sysutils/runit
    state: present

- name: Create /var/service
  file:
    path: /var/service
    state: directory
    owner: root
    group: wheel
    mode: "0755"

- name: Create /var/db/runit
  file:
    path: /var/db/runit
    state: directory
    owner: root
    group: wheel
    mode: "0755"

- name: Link /etc/sv
  file:
    path: /etc/sv
    src: /var/db/runit
    state: link
    owner: root
    group: wheel
    mode: "0755"

- name: Check if /usr/local/etc/sv exists
  stat:
    path: /usr/local/etc/sv
  register: stat_usr_local_etc_sv

- name: Migrate /usr/local/etc/sv
  when: (stat_usr_local_etc_sv.stat.isdir is defined) and (stat_usr_local_etc_sv.stat.isdir)
  shell:
    cmd: |
      set -o errexit -o nounset -o pipefail

      for _file in /usr/local/etc/sv/*(N); do
          sv stop ${_file} || :
          mv -v ${_file} /var/db/runit/
      done

      rmdir /usr/local/etc/sv/
    executable: /usr/local/bin/zsh
  changed_when: false

- name: Enable service
  # Not started here when rc starts it later in the first boot; see
  # firstboot_rc_services.
  service:
    name: runsvdir
    enabled: true
    state: "{{ omit if ('runsvdir' in (firstboot_rc_services | default([]))) else 'started' }}"
  notify:
    - reformat_rc_conf
